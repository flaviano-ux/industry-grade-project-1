apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment
spec:
  replicas: 6
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      name: pod1
      labels:
        tier: backend
    spec:
      nodeName: kube-w1
      containers:
        - image: flavian07/abc:v1-1
          name: abc

---
apiVersion: v1
kind: Service
metadata:
  name: appsvc
spec:
  type: NodePort
  selector:
    tier: backend
  ports:
    - port: 8080
      targetPort: 8080