---
- hosts: "{{ env }}"
  become: yes
  tasks: 
    - name: Deploying Application pods...
      shell: | 
         if [ `kubectl get deployment | grep -v NAME | awk '{print $1}' | grep mydeployment | wc -l` -gt 0 ]; then  
            echo "deleting previous application deployment"
            kubectl delete deployment `kubectl get deployment | grep -v NAME | awk '{print $1}' | grep mydeployment`
            echo "creating new application deployment"
            kubectl create deployment mydeployment --image=flavian07/abc:v1-1:{{ build }}
         else 
            echo "Deploying mydeployment Application"
            kubectl create deployment mydeployment --flavian07/abc:v1-1:{{ build }}
         fi
    - name: deploying service
      shell: |
         if [ `kubectl get service | grep mydeployment  | awk '{print $1}' | wc -l` -gt 0 ]; then
            echo "app service found, No actions taken"
         else
            echo "Creating App Services"
            kubectl expose deployment mydeployment --name mydeployment --type NodePort --port 8080 --target-port 8080